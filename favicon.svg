<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 渐变色：科技蓝到活力青 -->
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow1)">
    <!-- 起点节点 -->
    <circle cx="256" cy="768" r="40" fill="#2563EB"/>
    <!-- 过程节点 -->
    <circle cx="480" cy="544" r="24" fill="#06B6D4"/>
    
    <!-- 核心轨迹线 (平滑曲线) -->
    <path d="M 256 768 C 380 768, 380 544, 480 544 S 680 200, 768 256" 
          fill="none" 
          stroke="url(#grad1)" 
          stroke-width="48" 
          stroke-linecap="round"/>
          
    <!-- 终点节点 (大且醒目，代表当前记录位置) -->
    <circle cx="768" cy="256" r="70" fill="url(#grad1)"/>
    <circle cx="768" cy="256" r="30" fill="#FFFFFF"/>
  </g>
</svg>