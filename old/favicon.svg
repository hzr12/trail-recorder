<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="256" cy="256" r="240" fill="#0a1225"/>

  <!-- 地图定位针 -->
  <path d="M256 60 
           C340 60 400 130 400 200 
           C400 300 256 460 256 460 
           C256 460 112 300 112 200 
           C112 130 172 60 256 60 Z"
        fill="url(#accent)" filter="url(#glow)"/>

  <!-- 针内空心 -->
  <circle cx="256" cy="195" r="55" fill="#0a1225"/>

  <!-- 中心定位点 -->
  <circle cx="256" cy="195" r="22" fill="url(#accent)"/>
  <circle cx="256" cy="195" r="9" fill="#FFFFFF"/>

  <!-- 脉冲环 -->
  <circle cx="256" cy="195" r="72" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.28"/>
  <circle cx="256" cy="195" r="90" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.10"/>
</svg>