<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="cyan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Trail Recorder - 轨迹记录器</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/theme.css?t=20260804v1">
  <link rel="stylesheet" href="css/base.css?t=20260804v1">
  <link rel="stylesheet" href="css/map.css?t=20260804v1">
  <link rel="stylesheet" href="css/gps.css?t=20260804v1">
  <link rel="stylesheet" href="css/panel.css?t=20260804v1">
  <link rel="stylesheet" href="css/trail.css?t=20260804v1">
  <link rel="stylesheet" href="css/history.css?t=20260804v1">
  <link rel="stylesheet" href="css/stats.css?t=20260804v1">
  <link rel="stylesheet" href="css/responsive.css?t=20260804v1">
</head>
<body>
  <div id="map">
    <canvas id="circle-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <!-- 浮动控制按钮组 -->
  <div class="floating-buttons">
    <button id="gps-btn" class="fab-btn" title="定位到我的位置" aria-label="定位">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="10" r="3"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <span class="pulse-ring"></span>
    </button>
  </div>

  <!-- 底部控制面板 -->
  <div class="bottom-panel" id="bottomPanel">
    <div class="panel-handle">
      <div class="handle-bar"></div>
    </div>

    <!-- GPS 状态条 -->
    <div class="gps-status" id="gps-status">
      <span class="gps-dot"></span>
      <span class="gps-offline">⊙ 未定位，点击 GPS 按钮定位</span>
    </div>

    <div class="panel-header">
      <h1 class="panel-title">轨迹记录器</h1>
      <button id="theme-btn" class="theme-toggle" title="切换浅色主题">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
    <div class="accent-row">
      <span class="accent-label">主题</span>
      <button class="accent-dot active" data-accent="cyan" style="--c:#00D4AA" title="青"></button>
      <button class="accent-dot" data-accent="green" style="--c:#34D399" title="绿"></button>
      <button class="accent-dot" data-accent="blue" style="--c:#60A5FA" title="蓝"></button>
      <button class="accent-dot" data-accent="purple" style="--c:#A78BFA" title="紫"></button>
      <button class="accent-dot" data-accent="orange" style="--c:#FB923C" title="橙"></button>
    </div>

    <div class="panel-body">
      <!-- 轨迹常驻记录条 -->
      <div class="trail-record-bar" id="trail-record-bar">
        <span class="trail-dot" id="trail-bar-dot"></span>
        <span class="trail-bar-state" id="trail-bar-state">未记录</span>
        <button class="trail-bar-btn" id="trail-bar-btn">开始记录</button>
        <span class="trail-bar-dist" id="trail-bar-dist">0m</span>
      </div>

      <!-- 轨迹记录区 -->
      <div class="trail-section">
        <div class="trail-header">
          <span class="field-label">轨迹记录</span>
          <span class="trail-distance" id="trail-distance">0m</span>
        </div>
        <div class="trail-controls">
          <button id="trail-record-btn" class="btn btn-trail">
            <span class="trail-dot"></span> 开始记录
          </button>
          <button id="trail-pause-btn" class="btn btn-secondary btn-sm" disabled>暂停</button>
          <button id="trail-clear-btn" class="btn btn-secondary btn-sm" disabled>清除</button>
        </div>
        <div class="trail-actions">
          <button id="trail-stats-btn" class="btn-sm" disabled>统计</button>
          <button id="trail-smooth-btn" class="btn-sm active">平滑</button>
          <button id="export-report-btn" class="btn-sm" title="导出活动报告图片（含轨迹、速度曲线、统计）">报告</button>
        </div>
        <!-- 速度色阶图例 -->
        <div class="speed-legend">
          <div class="speed-legend-row">
            <span class="speed-legend-item"><i class="legend-walk"></i>0-10 km/h</span>
            <span class="speed-legend-item"><i class="legend-bike"></i>10-20 km/h</span>
            <span class="speed-legend-item"><i class="legend-bus"></i>20-60 km/h</span>
            <span class="speed-legend-item"><i class="legend-car"></i>60-120 km/h</span>
          </div>
          <div class="speed-legend-row">
            <span class="speed-legend-item"><i class="legend-train"></i>120-200 km/h</span>
            <span class="speed-legend-item"><i class="legend-hsr"></i>200-350 km/h</span>
            <span class="speed-legend-item"><i class="legend-sct"></i>&gt;350 km/h</span>
          </div>
        </div>
      </div>

      <!-- 速度曲线面板 -->
      <div id="speed-chart-section" class="speed-chart-section hidden">
        <div class="speed-chart-header">
          <span class="speed-chart-title">速度曲线</span>
          <span class="speed-chart-info" id="speed-chart-info"></span>
          <button id="speed-chart-toggle" class="speed-chart-toggle" title="展开/收起">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="speed-chart-body" id="speed-chart-body">
          <canvas id="speed-chart-canvas"></canvas>
        </div>
      </div>

      <!-- 历史轨迹 -->
      <div class="history-section">
        <div class="history-header">
          <span class="history-title">历史轨迹</span>
          <button class="history-manage-btn" id="history-manage-btn">管理</button>
        </div>
        <div class="history-list" id="history-list">
          <div class="history-empty">暂无轨迹记录</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 统计模态框 -->
  <div class="modal-overlay hidden" id="stats-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">轨迹统计</span>
        <button class="modal-close" id="stats-close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="trail-name-edit">
          <input type="text" class="trail-name-input" id="trail-name-input" placeholder="轨迹名称" maxlength="30">
          <button class="trail-name-save" id="trail-name-save">保存</button>
        </div>
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-card-value" id="stat-distance">0m</div>
            <div class="stat-card-label">总距离</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value" id="stat-duration">0s</div>
            <div class="stat-card-label">总时长</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value" id="stat-avg-speed">--</div>
            <div class="stat-card-label">平均速度</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value" id="stat-max-speed">--</div>
            <div class="stat-card-label">最高速度</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value" id="stat-points">0</div>
            <div class="stat-card-label">轨迹点数</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value" id="stat-start-time">--</div>
            <div class="stat-card-label">开始时间</div>
          </div>
        </div>
        <div class="histogram-section">
          <div class="histogram-title">速度分布</div>
          <div class="histogram-body">
            <canvas id="histogram-canvas"></canvas>
          </div>
        </div>
        <div class="export-row">
          <button class="export-btn" id="export-png-btn">导出图片</button>
          <button class="export-btn" id="export-gpx-btn">导出 GPX</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tencent Map API -->
  <script charset="utf-8" src="https://map.qq.com/api/js?v=2.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77&libraries=geometry,convertor"></script>

  <!-- Chart.js（速度曲线 + 直方图） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- 应用脚本 -->
  <script src="js/config.js?t=20260804v1"></script>
  <script src="js/toast.js?t=20260804v1"></script>
  <script src="js/storage.js?t=20260804v1"></script>
  <script src="js/trail.js?t=20260804v1"></script>
  <script src="js/gps.js?t=20260804v1"></script>
  <script src="js/map.js?t=20260804v1"></script>
  <script src="js/trail-app.js?t=20260804v1"></script>
  <script src="js/trail-ui.js?t=20260804v1"></script>
</body>
</html>
