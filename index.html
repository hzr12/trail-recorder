<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-title" content="途刻">
  <title>途刻</title>
  <!-- 预热外部连接：提前建立与腾讯地图/Chart.js CDN 的 TCP+TLS 握手，减少首屏等待 -->
  <link rel="preconnect" href="https://map.qq.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://map.qq.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260805">
  <link rel="apple-touch-icon" href="favicon.svg?v=20260805">
  <link rel="stylesheet" href="css/fonts.css?t=20260805v9">
  <link rel="stylesheet" href="css/theme.css?t=20260805v9">
  <link rel="stylesheet" href="css/base.css?t=20260805v10">
  <link rel="stylesheet" href="css/map.css?t=20260805v9">
  <link rel="stylesheet" href="css/panel.css?t=20260809v16">
  <link rel="stylesheet" href="css/gps.css?t=20260809v11">
  <link rel="stylesheet" href="css/trail.css?t=20260809v15">
  <link rel="stylesheet" href="css/toast-modal.css?t=20260805v9">
  <link rel="stylesheet" href="css/responsive.css?t=20260805v9">
</head>
<body>
  <div id="map">
    <canvas id="circle-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>

  <!-- 浮动控制按钮组 -->
  <div class="floating-buttons">
    <button id="gps-btn" class="fab-btn" title="定位到我的位置" aria-label="定位">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="10" r="3"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
      <span class="pulse-ring"></span>
    </button>
  </div>

  <!-- 底部控制面板 -->
  <div class="bottom-panel" id="bottomPanel">
    <div class="panel-handle">
      <div class="handle-bar"></div>
    </div>

    <!-- GPS 状态条 -->
    <div class="gps-status" id="gps-status">
      <span class="gps-dot"></span>
      <span class="gps-offline">⊙ 未定位，点击 GPS 按钮定位</span>
    </div>

    <div class="panel-header">
      <h1 class="panel-title">途刻</h1>
      <button id="theme-btn" class="theme-toggle" title="切换浅色主题">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>

    <!-- Tab 切换 -->
    <div class="mode-tabs" id="mode-tabs">
      <span class="mode-tab-slider" aria-hidden="true"></span>
      <button class="mode-tab active" data-tab="record" id="tab-record-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20c2-5 5-7 7-13"/>
          <circle cx="4" cy="20" r="1.5"/>
          <circle cx="17" cy="7" r="1.5"/>
        </svg>
        记录
      </button>
      <button class="mode-tab" data-tab="replay" id="tab-replay-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5,3 19,12 5,21" fill="currentColor" stroke="none"/>
          <line x1="19" y1="4" x2="19" y2="20"/>
        </svg>
        回放
      </button>
      <button class="mode-tab" data-tab="history" id="tab-history-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8v4l3 3"/>
          <circle cx="12" cy="12" r="10"/>
        </svg>
        历史
      </button>
    </div>

    <div class="panel-body">
      <!-- 记录 Tab -->
      <div id="tab-record" class="tab-pane">
      <div class="panel-card card-record">
      <!-- 轨迹记录 -->
      <div class="trail-section">
        <div class="trail-header">
          <span class="field-label">轨迹记录</span>
        </div>
        <div class="rec-stats-grid" id="rec-stats-grid">
          <div class="rec-stat">
            <span class="rec-stat-label">距离</span>
            <span class="rec-stat-value" id="trail-distance">0m</span>
          </div>
          <div class="rec-stat">
            <span class="rec-stat-label">时长</span>
            <span class="rec-stat-value" id="rec-duration">--</span>
          </div>
          <div class="rec-stat">
            <span class="rec-stat-label">当前速度</span>
            <span class="rec-stat-value" id="rec-cur-speed">--</span>
          </div>
          <div class="rec-stat">
            <span class="rec-stat-label">平均速度</span>
            <span class="rec-stat-value" id="rec-avg-speed">--</span>
          </div>
          <div class="rec-stat">
            <span class="rec-stat-label">最高速度</span>
            <span class="rec-stat-value" id="rec-max-speed">--</span>
          </div>
        </div>
        <div class="trail-controls">
          <button id="trail-record-btn" class="btn btn-trail">
            <span class="trail-dot"></span> 开始记录
          </button>
          <button id="trail-pause-btn" class="btn btn-secondary btn-sm" disabled>结束并保存</button>
          <button id="trail-clear-btn" class="btn btn-secondary btn-sm" disabled>清除</button>
        </div>
        <div class="trail-actions">
          <button id="trail-stats-btn" class="btn-sm" disabled> 统计</button>
          <button id="trail-smooth-btn" class="btn-sm active"> 平滑</button>
          <button id="export-report-btn" class="btn-sm" title="导出活动报告图片（含轨迹、速度曲线、统计）"> 报告</button>
        </div>

        <!-- 后台+省电模块 -->
        <div class="power-section" id="power-section">
          <span class="power-status" id="power-status">定位间隔: 2s</span>
          <button id="trail-autopause-btn" class="btn-sm" title="开启后连续静止自动暂停计时，恢复移动自动继续">自动暂停</button>
          <button id="power-saving-btn" class="btn-sm" title="省电模式">省电</button>
        </div>
        <!-- 速度色阶图例 -->
        <div class="speed-legend">
          <div class="speed-legend-row">
            <span class="speed-legend-item"><i class="legend-walk"></i>0-10 km/h</span>
            <span class="speed-legend-item"><i class="legend-bike"></i>10-20 km/h</span>
            <span class="speed-legend-item"><i class="legend-bus"></i>20-60 km/h</span>
            <span class="speed-legend-item"><i class="legend-car"></i>60-120 km/h</span>
          </div>
          <div class="speed-legend-row">
            <span class="speed-legend-item"><i class="legend-train"></i>120-200 km/h</span>
            <span class="speed-legend-item"><i class="legend-hsr"></i>200-350 km/h</span>
            <span class="speed-legend-item"><i class="legend-sct"></i>&gt;350 km/h</span>
          </div>
        </div>
      </div>
      </div><!-- /card-record -->

      <!-- 速度曲线面板 -->
      <div id="speed-chart-section" class="speed-chart-section hidden">
        <div class="speed-chart-header">
          <span class="speed-chart-title">速度曲线</span>
          <span class="speed-chart-info" id="speed-chart-info"></span>
          <button id="speed-chart-toggle" class="speed-chart-toggle" title="展开/收起">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="speed-chart-body" id="speed-chart-body">
          <canvas id="speed-chart-canvas"></canvas>
        </div>
      </div>

      <!-- 海拔剖面面板（记录页，速度曲线下方） -->
      <div id="elev-profile-section" class="elev-profile-section hidden">
        <div class="elev-profile-header">
          <span class="elev-profile-title">海拔剖面</span>
          <span class="elev-profile-info" id="elev-profile-info"></span>
          <button id="elev-profile-toggle" class="elev-profile-toggle" title="展开/收起">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="elev-profile-body" id="elev-profile-body">
          <canvas id="elev-profile-canvas"></canvas>
        </div>
      </div>

      </div><!-- /tab-record -->

      <!-- 回放 Tab -->
      <div id="tab-replay" class="tab-pane" style="display:none">
        <div class="replay-empty" id="replay-empty">
          <div class="replay-empty-icon">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5,3 19,12 5,21" fill="currentColor" opacity="0.3"/>
              <line x1="19" y1="4" x2="19" y2="20"/>
            </svg>
          </div>
          <div class="replay-empty-title">选择轨迹开始回放</div>
          <div class="replay-empty-desc">点击下方历史轨迹中的播放按钮，<br>或在记录 Tab 中点击回放按钮</div>
        </div>

        <!-- 回放控制面板（加载轨迹后显示） -->
        <div id="replay-panel" class="replay-panel hidden">
          <div class="replay-header">
            <span class="replay-title" id="replay-title">轨迹回放</span>
            <span class="replay-time" id="replay-time">00:00 / 00:00</span>
          </div>
          <div class="replay-progress">
            <input type="range" id="replay-slider" class="replay-slider" min="0" max="1000" value="0" step="1">
          </div>
          <div class="replay-controls">
            <button id="replay-play-btn" class="replay-btn play-btn" title="播放/暂停">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <polygon points="6,4 20,12 6,20" id="replay-play-icon"/>
              </svg>
            </button>
            <button id="replay-stop-btn" class="replay-btn stop-btn" title="停止">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <rect x="5" y="5" width="14" height="14" rx="2"/>
              </svg>
            </button>
            <button id="replay-follow-btn" class="replay-btn follow-btn" title="跟随轨迹" aria-pressed="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
              </svg>
            </button>
            <div class="replay-speeds">
              <button class="speed-btn" data-speed="1">1x</button>
              <button class="speed-btn" data-speed="2">2x</button>
              <button class="speed-btn" data-speed="5">5x</button>
              <button class="speed-btn" data-speed="10">10x</button>
            </div>
          </div>
          <div class="replay-info" id="replay-info"></div>
        </div>

        <!-- 可回放轨迹列表 -->
        <div class="panel-card card-replay-list">
        <div class="replay-trails-section">
          <div class="replay-trails-header">
            <span>可回放轨迹</span>
            <input type="text" class="trail-search-input" id="replay-search" placeholder="搜索…" />
            <select class="trail-time-select" id="replay-time-range">
              <option value="all">全部</option>
              <option value="today">今天</option>
              <option value="week">本周</option>
              <option value="month">本月</option>
            </select>
            <select class="trail-sort-select" id="replay-sort" title="排序方式">
              <option value="time">最新优先</option>
              <option value="distance">距离</option>
              <option value="duration">时长</option>
              <option value="points">点数</option>
            </select>
            <button class="header-btn" id="batch-select-all" title="全选当前">全选当前</button>
            <button class="fav-filter-btn" id="replay-fav-filter" title="仅看收藏">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span>仅看收藏</span>
            </button>
          </div>
          <div class="trail-list" id="replay-trail-list">
            <div class="trail-list-empty">暂无历史轨迹</div>
          </div>
        </div>
        </div><!-- /card-replay-list -->
      </div>

      <!-- 历史 Tab -->
      <div id="tab-history" class="tab-pane" style="display:none">
        <div class="panel-card card-history-list">
        <div class="trail-list-header">
          <input type="text" class="trail-search-input" id="history-search" placeholder="搜索名称/日期/距离…" />
          <select class="trail-time-select" id="history-time-range">
            <option value="all">全部时间</option>
            <option value="today">今天</option>
            <option value="week">本周</option>
            <option value="month">本月</option>
          </select>
          <select class="trail-sort-select" id="history-sort" title="排序方式">
            <option value="time">最新优先</option>
            <option value="distance">距离</option>
            <option value="duration">时长</option>
            <option value="points">点数</option>
          </select>
          <button class="header-btn" id="batch-select-all" title="全选当前">全选当前</button>
          <button class="fav-filter-btn" id="history-fav-filter" title="仅看收藏">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>仅看收藏</span>
          </button>
        </div>
        <div class="trail-list" id="trail-list">
          <div class="trail-list-empty">暂无历史轨迹</div>
        </div>
        </div><!-- /card-history-list -->
      </div>

      <!-- 批量操作工具栏（多选时显示） -->
      <div class="batch-toolbar" id="batch-toolbar">
        <span class="batch-count">未选择</span>
        <div class="batch-actions">
          <button class="batch-btn batch-export" id="batch-export" disabled>分享合集</button>
          <button class="batch-btn batch-merge" id="batch-merge" disabled>合并轨迹</button>
          <button class="batch-btn batch-delete" id="batch-delete" disabled>删除</button>
          <button class="batch-btn batch-invert" id="batch-invert" disabled>反选</button>
          <button class="batch-btn batch-clear" id="batch-clear" disabled>取消选择</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tencent Map API -->
  <script charset="utf-8" src="https://map.qq.com/api/js?v=2.exp&key=OB4BZ-D4W3U-B7VVO-4PJWW-6TKDJ-WPB77&libraries=geometry,convertor"></script>

  <!-- Chart.js（速度曲线） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- 应用脚本 -->
  <script src="js/config.js?t=20260810v12"></script>
  <script src="js/toast.js?t=20260805v8"></script>
  <script src="js/storage.js?t=20260805v11"></script>
  <script src="js/trail.js?t=20260809v12"></script>
  <script src="js/trail-analysis.js?t=20260809v13"></script>
  <script src="js/map.js?t=20260809v23"></script>
  <script src="js/gps.js?t=20260810v16"></script>
  <script src="js/replay.js?t=20260808v20"></script>
  <script src="js/app-core.js?t=20260810v27"></script>
  <script src="js/app-gps-ui.js?t=20260809v10"></script>
</body>
</html>
